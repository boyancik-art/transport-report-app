<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Transport TS"><title>Transport Report TS</title><link rel="manifest" href="./manifest.webmanifest?v=437"><link rel="icon" href="/icon.png"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v14.png"><style>:root{--bg:#f4f5f7;--card:#fff;--ink:#18191d;--muted:#737782;--line:#e5e7eb;--accent:#8b2030;--dark:#1d2025;--soft:#f7eef0;--ok:#24724c}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:min(420px,100%);background:#fff;border-radius:26px;padding:30px;box-shadow:0 18px 55px #0002;text-align:center}.logo{width:76px;height:76px;border-radius:20px}.loginbox input,.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:5px 0}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.loginbox .btn{width:100%;margin-top:9px}.top{min-height:70px;background:var(--dark);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 18px;position:sticky;top:0;z-index:20}.top .logo{width:43px;height:43px;border-radius:12px}.brand{font-weight:900}.sub,.note{font-size:12px;color:var(--muted)}.top .sub{color:#c7cad0}.nav{margin-left:auto;display:flex;gap:5px}.nav button{border:0;border-radius:10px;padding:9px 11px;background:#30343a;color:#fff}.nav button.active{background:var(--accent)}.wrap{max-width:1400px;margin:auto;padding:18px}.filters{display:flex s{grid-template-columns:1fr}.nav{display:none}.wrap{padding-bottom:82px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:#fff;padding:10px 2px;font-size:10px;color:#555}.bottom button b{display:block;font-size:20px;margin-bottom:2px}}@media(max-width:600px){.wrap{padding:11px;padding-bottom:82px}.kpis{grid-template-columns:repeat(2,1fr)}.val{font-size:22px}.top{padding:8px 11px}.top .sub{display:none}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}}</style></head><body><div id="login" class="login"><div class="loginbox"><img class="logo" src="./icon.png"><h1>Transport Report TS</h1><p class="note">Логістика та управлінська аналітика</p><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Пароль"><button class="btn" onclick="signIn()">Увійти</button><p id="loginErr" class="err"></p></div></div><div id="app" class="hide"><header class="top"><img class="logo" src="./icon.png"><div><div class="brand">Transport Report TS</div><div class="sub">Management Control Tower · TEST</div></div><nav class="nav"><button onclick="go('home',this)" class="active">Головна</button><button onclick="go('logistics',this)">Логістика</button><button onclick="go('analytics',this)">Аналітика</button><button onclick="go('ai',this)">AI</button></nav><button class="btn" onclick="logout()">Вийти</button></header><main class="wrap"><div class="filters"><input id="date" type="date"><button class="btn" onclick="loadAll()">Оновити</button><span id="dataTag" class="tag"></span></div><div id="view"></div></main><nav class="bottom"><button onclick="go('home')"><b>⌂</b>Головна</button><button onclick="go('logistics')"><b>🚚</b>Логістика</button><button onclick="go('analytics')"><b>▦</b>Аналітика</button><button onclick="go('ai')"><b>✦</b>AI</button><button onclick="go('more')"><b>•••</b>Ще</button></nav></div><script>const SB='https://ccmwhtojyofefyzespty.supabase.co',KEY='sb_publishable_a5gJ8rAw7dFcJV_iPg4TJg_glZIwMgh';let token=localStorage.trts_token||'',D={routes:[],points:[],facts:[],alloc:[],manual:[],docs:[]},page='home';const N=n=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:1}).format(+n||0),M=n=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0}).format(+n||0)+' грн',E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');async function api(path,opt={}){let h={apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})};let r=await fetch(SB+path,{...opt,headers:h});if(r.status===401){logout();throw Error('Сесія завершилась')}if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}async function signIn(){loginErr.textContent='';try{let r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})}),j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||'Помилка входу');token=j.access_token;localStorage.trts_token=token;start()}catch(e){loginErr.textContent=e.message}}function logout(){localStorage.removeItem('trts_token');token='';app.classList.add('hide');login.classList.remove('hide')}async function start(){login.classList.add('hide');app.classList.remove('hide');let r=await api('/rest/v1/routes?select=route_date&order=route_date.desc&limit=1');date.value=r[0]?.route_date||new Date().toISOString().slice(0,10);loadAll()}async function loadAll(){try{let d=date.value;dataTag.textContent='Реальні дані · '+d;let routes=await api('/rest/v1/routes?select=id,route_delivery_id,expeditor_name,warehouse,total_points,total_documents,total_weight,total_pallets,total_order_amount&route_date=eq.'+d),ids=routes.map(x=>x.id),points=[],facts=[],alloc=[],manual=[],docs=[];manual=await api('/rest/v1/manual_transport_entries?select=*&entry_date=eq.'+d+'&order=created_at.desc');if(ids.length){let q=encodeURIComponent('('+ids.join(',')+')');[points,facts]=await Promise.all([api('/rest/v1/route_points?select=id,route_id,customer_id,customer_name,documents_count,weight,pallets,bottles,places,order_amount,point_delivery_cost&route_id=in.'+q),api('/rest/v1/route_facts?select=*&route_id=in.'+q)]);let pids=points.map(x=>x.id);if(pids.length)alloc=await api('/rest/v1/route_business_allocations?select=*&route_point_id=in.'+encodeURIComponent('('+pids.join(',')+')'));let deliveries=routes.map(x=>x.route_delivery_id).filter(Boolean);if(deliveries.length)docs=await api('/rest/v1/source_documents?select=id,document_date,route_delivery_id,operation_code,sale_code,address_id,customer_id,employee_id,business_unit,customer_name,delivery_address,warehouse,bottles,places,weight,order_amount,pallets&route_delivery_id=in.'+encodeURIComponent('('+deliveries.map(x=>'"'+String(x).replaceAll('"','')+'"').join(',')+')'))}D={routes,points,facts,alloc,manual,docs};go(page)}catch(e){view.innerHTML='<div class="card box err">Помилка завантаження: '+E(e.message)+'</div>'}}function go(p,b){page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');({home,logistics,analytics,ai,more}[p]||home)()}function sums(){let tt=D.points.length,pal=D.points.reduce((s,x)=>s+(+x.pallets||0),0),sales=D.points.reduce((s,x)=>s+(+x.order_amount||0),0),routeCost=D.facts.reduce((s,x)=>s+(+x.tariff||0),0),man=D.manual.reduce((s,x)=>s+(+x.expense_amount||0),0),cost=routeCost+man;return{tt,pal,sales,cost,routeCost,man}}function home(){let s=sums(),stv=D.facts.filter(x=>/stv|sav/i.test(x.carrier_name||'')).reduce((a,x)=>a+(+x.tariff||0),0),cour=D.manual.filter(x=>x.entry_type==='courier').reduce((a,x)=>a+(+x.expense_amount||0),0),rep=D.manual.filter(x=>x.entry_type==='branch_replenishment').reduce((a,x)=>a+(+x.expense_amount||0),0),local=s.routeCost-stv,unknown=D.facts.filter(x=>x.tariff_unknown).length;view.innerHTML='<div class="head"><div><h2>Україна · сьогодні</h2><div class="note">Факт ТТ, об’єми та транспортні витрати</div></div><span class="tag">'+D.routes.length+' маршрутів</span></div><div class="kpis">'+K('ТТ',N(s.tt),'showTT()')+K('Палети',N(s.pal))+K('Продажі',M(s.sales))+K('Витрати',M(s.cost),'showCosts()')+K('Логістика',s.sales?(s.cost/s.sales*100).toFixed(2)+'%':'—')+K('1 ТТ',s.tt?M(s.cost/s.tt):'—')+'</div><div class="grid2"><div class="card box"><div class="head"><h3>Структура транспортних витрат</h3><b>'+M(s.cost)+'</b></div>'+C('Локальна доставка',local,"costDetail('local')")+C('STV / SAV',stv,"costDetail('stv')")+C('Кур’єрська доставка',cour,"costDetail('courier')")+C('Поповнення філій',rep,"costDetail('branch')")+'</div><div class="card box '+(unknown?'warn':'')+'"><h3>Контроль дня</h3><p><b>'+D.routes.length+'</b> маршрутів · <b>'+s.tt+'</b> ТТ</p><p><b>'+unknown+'</b> маршрутів без тарифу</p><p><b>'+D.facts.filter(x=>x.departure_time).length+'</b> фактів виїзду внесено</p><p class="note">STV/SAV відображає реальні внесені факти. Зональний контроль тарифу тестуємо окремо без вигаданих значень.</p></div></div><div class="section">'+branchTiles()+'</div>'}function logistics(){let rows=D.routes.map(r=>{let f=D.facts.find(x=>x.route_id===r.id)||{},p=D.points.filter(x=>x.route_id===r.id);return'<tr class="click" onclick="routeCard('+r.id+')"><td><b>'+E(r.route_delivery_id||r.id)+'</b></td><td>'+E(r.expeditor_name||'—')+'</td><td>'+E(r.warehouse||'—')+'</td><td>'+p.length+'</td><td>'+N(p.reduce((s,x)=>s+(+x.pallets||0),0))+'</td><td>'+E(f.carrier_name||'—')+'</td><td>'+E(f.wave||'—')+'</td><td>'+E(f.departure_time||'—')+'</td><td>'+M(f.tariff||0)+'</td></tr>'}).join('');view.innerHTML='<div class="head"><div><h2>Логістичний блок</h2><div class="note">Хвилі · тарифи · перевізники · факт виїзду</div></div><span class="tag">'+D.routes.length+' маршрутів</span></div><div class="card tablecard"><table class="table"><thead><tr><th>Маршрут</th><th>Експедитор</th><th>Склад</th><th>ТТ</th><th>Палети</th><th>Перевізник</th><th>Хвиля</th><th>Виїзд</th><th>Тариф</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="section grid2"><div class="card box"><h3>Ручне внесення витрат</h3>'+manualForm()+'</div><div class="card box"><h3>Останні ручні записи</h3>'+manualRows()+'</div></div>'}function analytics(){view.innerHTML='<div class="head"><div><h2>Управлінська аналітика</h2><div class="note">Україна → філія → бізнес → ТТ → документ</div></div></div><div class="section">'+branchTiles()+'</div><div class="section">'+businessTiles()+'</div>'}function branchTiles(){let m={};D.routes.forEach(r=>{let k=branch(r.warehouse),pts=D.points.filter(x=>x.route_id===r.id);m[k]??={tt:0,p:0,s:0};m[k].tt+=pts.length;m[k].p+=pts.reduce((a,x)=>a+(+x.pallets||0),0);m[k].s+=pts.reduce((a,x)=>a+(+x.order_amount||0),0)});return'<h3>Філії</h3><div class="tiles">'+Object.entries(m).sort((a,b)=>b[1].s-a[1].s).map(([n,x])=>'<div class="card tile" onclick="showBranch(\''+E(n)+'\')"><div class="label">'+E(n)+'</div><b>'+x.tt+' ТТ</b><div>'+N(x.p)+' пал · '+M(x.s)+'</div></div>').join('')+'</div>'}function businessTiles(){let m={};D.alloc.forEach(x=>{let k=business(x.business_unit);m[k]??={tt:new Set(),p:0,s:0,c:0};m[k].tt.add(x.route_point_id);m[k].p+=+x.pallets||0;m[k].s+=+x.order_amount||0;m[k].c+=+x.allocated_delivery_cost||0});return'<h3>Бізнеси</h3><div class="tiles">'+Object.entries(m).sort((a,b)=>b[1].s-a[1].s).map(([n,x])=>'<div class="card tile"><div class="label">'+E(n)+'</div><b>'+x.tt.size+' ТТ</b><div>'+N(x.p)+' пал · '+M(x.s)+'</div><div class="note">Витрати: '+M(x.c)+'</div></div>').join('')+'</div>'}function ai(){view.innerHTML='<div class="card box ai"><h2>✦ Transport AI</h2><p>AI-аналітик транспортної логістики</p><div class="chips"><button class="chip">Що сьогодні не так?</button><button class="chip">Чому логістика дорожча?</button><button class="chip">ТТ без документів</button><button class="chip">Порівняй STV та SAV</button><button class="chip">Звіт керівництву</button></div><p class="note" style="margin-top:18px">Тестовий екран. Підключення діалогового аналізу буде наступним етапом після перевірки структури та цифр.</p></div>'}function more(){view.innerHTML='<div class="tiles"><div class="card tile" onclick="showCosts()"><div class="label">Фінанси</div><b>Види доставки</b></div><div class="card tile" onclick="showTT()"><div class="label">Дані</div><b>Торгові точки</b></div><div class="card tile" onclick="logistics()"><div class="label">Операції</div><b>Маршрути</b></div></div>'}function showTT(filterIds=null){let p=filterIds?D.points.filter(x=>filterIds.includes(x.route_id)):D.points;view.innerHTML='<button class="btn back" onclick="go(\'home\')">← Назад</button><h2>Торгові точки · '+p.length+'</h2><div class="card tablecard"><table class="table"><thead><tr><th>Клієнт</th><th>Док.</th><th>Вага</th><th>Палети</th><th>Продажі</th><th>Бізнес</th><th>ТП / EmployeeID</th></tr></thead><tbody>'+p.map(x=>{let a=D.alloc.filter(z=>z.route_point_id===x.id),bu=[...new Set(a.map(z=>business(z.business_unit)))].join(', '),em=[...new Set(a.map(z=>z.employee_id).filter(Boolean))].join(', ');return'<tr class="click" onclick="pointCard('+x.id+')"><td><b>'+E(x.customer_name||'—')+'</b></td><td>'+x.documents_count+'</td><td>'+N(x.weight)+'</td><td>'+N(x.pallets)+'</td><td>'+M(x.order_amount)+'</td><td>'+E(bu||'—')+'</td><td>'+E(em||'—')+'</td></tr>'}).join('')+'</tbody></table></div>'}function pointCard(id){let x=D.points.find(z=>z.id===id),r=D.routes.find(z=>z.id===x.route_id),docs=D.docs.filter(d=>String(d.route_delivery_id)===String(r?.route_delivery_id)&&(!x.customer_id||String(d.customer_id)===String(x.customer_id))),a=D.alloc.filter(z=>z.route_point_id===id);view.innerHTML='<button class="btn back" onclick="showTT()">← ТТ</button><div class="card box section"><div class="label">Торгова точка</div><h2>'+E(x.customer_name||'—')+'</h2><p>Маршрут: <b>'+E(r?.route_delivery_id||'—')+'</b> · Склад: '+E(r?.warehouse||'—')+'</p><p>Палети: <b>'+N(x.pallets)+'</b> · Вага: <b>'+N(x.weight)+'</b> · Продажі: <b>'+M(x.order_amount)+'</b></p><p>Бізнес: '+E([...new Set(a.map(z=>business(z.business_unit)))].join(', ')||'—')+' · ТП/EmployeeID: '+E([...new Set(a.map(z=>z.employee_id).filter(Boolean))].join(', ')||'—')+'</p></div><h3>Документи · '+docs.length+'</h3><div class="card tablecard"><table class="table"><thead><tr><th>Дата</th><th>Операція</th><th>Клієнт</th><th>Адреса</th><th>Бізнес</th><th>EmployeeID</th><th>Сума</th></tr></thead><tbody>'+docs.map(d=>'<tr><td>'+E(d.document_date)+'</td><td>'+E(d.operation_code||d.sale_code||'—')+'</td><td>'+E(d.customer_name||'—')+'</td><td>'+E(d.delivery_address||'—')+'</td><td>'+E(business(d.business_unit))+'</td><td>'+E(d.employee_id||'—')+'</td><td>'+M(d.order_amount)+'</td></tr>').join('')+'</tbody></table></div>'}function routeCard(id){let r=D.routes.find(x=>x.id===id),f=D.facts.find(x=>x.route_id===id)||{};view.innerHTML='<button class="btn back" onclick="logistics()">← Маршрути</button><div class="card box section"><div class="label">Маршрут</div><h2>'+E(r.route_delivery_id||r.id)+'</h2><p>Експедитор: <b>'+E(r.expeditor_name||'—')+'</b></p><p>Перевізник: <b>'+E(f.carrier_name||'—')+'</b> · Хвиля: <b>'+E(f.wave||'—')+'</b></p><p>Виїзд: <b>'+E(f.departure_time||'не внесено')+'</b> · Тариф: <b>'+M(f.tariff||0)+'</b></p><button class="btn" onclick="showTT(['+id+'])">Відкрити '+D.points.filter(x=>x.route_id===id).length+' ТТ</button></div>'}function showBranch(n){let ids=D.routes.filter(r=>branch(r.warehouse)===n).map(r=>r.id);showTT(ids)}function showCosts(){let s=sums();view.innerHTML='<button class="btn back" onclick="go(\'home\')">← Назад</button><h2>Транспортні витрати</h2><div class="tiles"><div class="card tile"><div class="label">Загалом</div><b>'+M(s.cost)+'</b></div><div class="card tile"><div class="label">Маршрутні тарифи</div><b>'+M(s.routeCost)+'</b></div><div class="card tile"><div class="label">Ручні витрати</div><b>'+M(s.man)+'</b></div></div>'+manualRows()}function costDetail(t){if(t==='courier'||t==='branch'){view.innerHTML='<button class="btn back" onclick="go(\'home\')">← Назад</button><h2>'+(t==='courier'?'Кур’єрська доставка':'Поповнення філій')+'</h2>'+manualRows(t);return}let facts=D.facts.filter(x=>t==='stv'?/stv|sav/i.test(x.carrier_name||''):!/stv|sav/i.test(x.carrier_name||''));view.innerHTML='<button class="btn back" onclick="go(\'home\')">← Назад</button><h2>'+(t==='stv'?'STV / SAV':'Локальна доставка')+'</h2><div class="card tablecard"><table class="table"><thead><tr><th>Перевізник</th><th>Хвиля</th><th>Тариф</th><th>Без тарифу</th></tr></thead><tbody>'+facts.map(f=>'<tr><td>'+E(f.carrier_name||'—')+'</td><td>'+E(f.wave||'—')+'</td><td>'+M(f.tariff||0)+'</td><td>'+(f.tariff_unknown?'Так':'Ні')+'</td></tr>').join('')+'</tbody></table></div>'}function manualForm(){return'<div class="formgrid"><select id="mtType" class="field"><option value="branch_replenishment">Поповнення філій</option><option value="courier">Кур’єрська доставка</option></select><input id="mtCarrier" class="field" placeholder="Перевізник"><input id="mtSender" class="field" placeholder="Склад відправника"><input id="mtReceiver" class="field" placeholder="Філія отримувач"><input id="mtPallets" class="field" type="number" step="0.001" placeholder="Палети"><input id="mtExpense" class="field" type="number" step="0.01" placeholder="Витрати, грн"><input id="mtShip" class="field" type="number" placeholder="Відправлення"><input id="mtPoints" class="field" type="number" placeholder="ТТ"><input id="mtSales" class="field" type="number" step="0.01" placeholder="Продажі"><input id="mtComment" class="field full" placeholder="Коментар"><button class="btn full" onclick="saveManual()">Зберегти</button></div>'}async function saveManual(){try{let o={entry_date:date.value,entry_type:mtType.value,sender_warehouse:mtSender.value||null,receiver_branch:mtReceiver.value||null,carrier_name:mtCarrier.value||null,pallets:+mtPallets.value||0,expense_amount:+mtExpense.value||0,shipments_count:+mtShip.value||0,points_count:+mtPoints.value||0,sales_amount:+mtSales.value||0,comment:mtComment.value||null};await api('/rest/v1/manual_transport_entries',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(o)});await loadAll()}catch(e){alert('Не збережено: '+e.message)}}function manualRows(type){let a=type?D.manual.filter(x=>x.entry_type===type):D.manual;if(!a.length)return'<p class="note">Записів за дату немає.</p>';return'<div class="card tablecard"><table class="table"><thead><tr><th>Тип</th><th>Відправник</th><th>Отримувач</th><th>Перевізник</th><th>Палети</th><th>ТТ</th><th>Витрати</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+E(x.entry_type==='courier'?'Кур’єрка':'Поповнення')+'</td><td>'+E(x.sender_warehouse||'—')+'</td><td>'+E(x.receiver_branch||'—')+'</td><td>'+E(x.carrier_name||'—')+'</td><td>'+N(x.pallets)+'</td><td>'+N(x.points_count)+'</td><td>'+M(x.expense_amount)+'</td></tr>').join('')+'</tbody></table></div>'}function branch(w=''){let s=w.toLowerCase();for(let [q,n] of [['київ','Київ'],['льв','Львів'],['малех','Львів'],['одес','Одеса'],['дніпр','Дніпро'],['харків','Харків'],['черніг','Чернігів'],['вінниц','Вінниця'],['хмель','Хмельницький'],['івано','Івано-Франківськ'],['франків','Івано-Франківськ'],['рівн','Рівне'],['луць','Луцьк'],['терноп','Тернопіль'],['черкас','Черкаси'],['чернів','Чернівці']])if(s.includes(q))return n;return w.split(',')[0]||'Інше'}function business(s=''){let x=s.toLowerCase();if(x.includes('horeca'))return'HoReCa';if(x.includes('опт'))return'Distribution';if(x.includes('корпорат'))return'Corporate';if(x.includes('wt')||x.includes('retail'))return'Retail WT';if(x.includes('крафт')||x.includes('kraft'))return'Kraft';return s||'Інше'}function K(a,b,fn=''){return'<div class="card kpi" '+(fn?'onclick="'+fn+'"':'')+'><div class="label">'+a+'</div><div class="val">'+b+'</div><div class="delta">Натисніть для деталізації</div></div>'}function C(a,b,fn){return'<div class="cost" onclick="'+fn+'"><span>'+a+'</span><b>'+M(b)+' ›</b></div>'}if(token)start();</script><script src="./patch-v37.js?v=437"></script><script src="./patch-v38.js?v=437"></script><script src="./reference-v39.js?v=437"></script><script src="./patch-v39.js?v=437"></script><script src="./patch-v39-fix.js?v=437"></script><script src="./patch-v39-bottles.js?v=437"></script><script src="./patch-v39-route-fields.js?v=437"></script><script src="./patch-v40-pickup.js?v=437"></script><script src="./patch-v41-datafix.js?v=437"></script><script src="./patch-v41-sections.js?v=437"></script><script src="./patch-v41-employee-names.js?v=437"></script><script src="./patch-v41-mobile-scale.js?v=437"></script><script src="./patch-v41-route-scale.js?v=437"></script><script src="./patch-v43-operations.js?v=437"></script><script src="./patch-v43-1-blocks.js?v=437"></script><script src="./patch-v43-1-header.js?v=437"></script><script src="./patch-v43-1-ops-courier.js?v=437"></script><script src="./patch-v43-7-pickup-cards.js?v=437"></script></body></html>
