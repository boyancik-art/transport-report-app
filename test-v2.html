<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d12"><title>Transport Report V2 TEST</title><style>
:root{--bg:#080b10;--panel:#10151d;--panel2:#141b24;--line:#222c38;--ink:#f5f7fb;--muted:#8f9aac;--blue:#6481ff;--green:#63df7b;--violet:#a66cff;--orange:#ff9c35;--gold:#f5c044;--teal:#42d7c6;--lime:#6ce379;--red:#ff6d7a}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 20% -10%,#182238 0,transparent 26%),radial-gradient(circle at 95% 0,#0d2c2a 0,transparent 20%),linear-gradient(180deg,#080b10,#0a0f15 55%,#070a0e);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}body{padding-bottom:84px}.hide{display:none!important}button,input,select{font:inherit}.shell{width:min(560px,100%);margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px 96px}.top{display:flex;justify-content:space-between;align-items:center;padding:17px 0 14px;gap:10px}.top h1{font-size:28px;margin:0;font-weight:900;letter-spacing:-.03em}.datebox{display:flex;gap:7px;align-items:center}.datebox input{width:132px;border:1px solid var(--line);border-radius:12px;background:#0e141b;color:#fff;padding:10px 9px;font-size:12px}.iconbtn{border:1px solid var(--line);border-radius:12px;background:#0e141b;color:#dce2eb;width:42px;height:42px}.tabs{display:flex;gap:6px;overflow-x:auto;padding:3px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-width:82px;border:1px solid #1e2833;border-radius:12px;background:linear-gradient(180deg,#10161e,#0d1218);color:#d8dee8;padding:10px 8px;text-align:center;flex:0 0 auto}.tab b{display:block;font-size:12px}.tab span{display:inline-flex;min-width:28px;justify-content:center;margin-top:6px;border-radius:8px;background:#151d27;padding:3px 7px;font-size:12px;font-weight:900}.tab.active{box-shadow:0 0 0 1px currentColor inset,0 0 24px #0007}.tab.base{color:var(--blue)}.tab.stv{color:var(--green)}.tab.sav{color:var(--violet)}.tab.fop{color:var(--orange)}.tab.cour{color:var(--gold)}.tab.branch{color:var(--teal)}.tab.bakery{color:#f4c54e}.tab.pickup{color:var(--lime)}.hero{border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#141b24,#0d1218);padding:17px;margin:3px 0 12px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-70px;top:-75px;background:var(--accent,#6481ff);filter:blur(42px);opacity:.16}.hero h2{font-size:21px;margin:0 0 4px}.hero .sub{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}.stat{border-left:1px solid #27313c;padding-left:9px}.stat:first-child{border-left:0;padding-left:0}.stat small{display:block;color:var(--muted);font-size:9px}.stat strong{display:block;margin-top:4px;font-size:15px}.toolbar{display:flex;justify-content:space-between;gap:8px;margin:10px 0}.ghost{border:1px solid var(--line);background:#0f151c;color:#cfd6e1;border-radius:11px;padding:9px 12px;font-size:12px}.list{display:grid;gap:9px}.route{border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#121923,#0d1218);padding:13px;position:relative;overflow:hidden}.route:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,#6481ff)}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.code{font-size:10px;color:#9aa7b9}.date{font-size:10px;color:#aab3c0}.exp{font-size:18px;font-weight:900;margin:4px 0 7px;line-height:1.18}.wh{font-size:10px;color:var(--muted);line-height:1.35}.mini{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;color:#cbd3de;font-size:10px}.mini b{color:#fff}.actions{display:flex;justify-content:flex-end;margin-top:10px}.assign{border:1px solid #4f65f4;background:linear-gradient(135deg,#4f68ff,#332a91);color:#fff;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:800}.monthly{border:1px solid #25452d;border-radius:16px;background:linear-gradient(135deg,#102018,#0b1410);padding:13px;margin-bottom:10px}.monthly .mh{display:flex;justify-content:space-between;align-items:center}.monthly h3{margin:0;color:var(--green);font-size:15px}.monthly .tag{font-size:9px;border:1px solid #315a3a;border-radius:8px;padding:4px 7px;color:#9ce8a7}.monthly p{margin:4px 0 0;color:#81918a;font-size:10px}.monthly .cols{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid #213328;font-size:10px}.empty{border:1px dashed #293542;border-radius:16px;padding:24px;text-align:center;color:var(--muted);font-size:12px}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:min(390px,100%);padding:24px;border:1px solid var(--line);border-radius:22px;background:#0e141b}.loginbox h1{margin:0 0 4px}.loginbox p{color:var(--muted);font-size:12px}.loginbox input{width:100%;padding:12px;margin:5px 0;border-radius:11px;border:1px solid var(--line);background:#090d12;color:#fff}.primary{width:100%;margin-top:7px;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#5974ff,#6739d9);color:#fff;font-weight:900}.err{color:#ff7b87;font-size:11px}.sheet{position:fixed;inset:0;background:#0008;display:grid;align-items:end;z-index:99}.sheetbox{width:min(560px,100%);margin:auto;background:#111821;border:1px solid #283443;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheetbox h3{margin:0 0 4px}.sheetbox p{color:var(--muted);font-size:11px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.choice{border:1px solid var(--line);background:#0c1218;color:#fff;border-radius:12px;padding:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1016ee;border-top:1px solid #202a35;backdrop-filter:blur(18px);padding:8px 0 env(safe-area-inset-bottom);z-index:30}.bottomin{width:min(560px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.bottom button{border:0;background:transparent;color:#738094;padding:4px;font-size:9px}.bottom button b{display:block;font-size:17px;margin-bottom:2px}.bottom button.active{color:#7d6fff}.debug{font-size:9px;color:#647083;margin-top:12px;text-align:center}
</style></head><body><div id="login" class="login"><div class="loginbox"><h1>Transport Report V2</h1><p>Нова тестова мобільна версія</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button class="primary" onclick="signIn()">Увійти</button><div id="loginErr" class="err"></div></div></div><div id="app" class="hide"><main class="shell"><div class="top"><h1>Логістика</h1><div class="datebox"><input id="day" type="date"><button class="iconbtn" onclick="load()">↻</button></div></div><div id="tabs" class="tabs"></div><div id="content"></div><div id="debug" class="debug"></div></main><nav class="bottom"><div class="bottomin"><button><b>▥</b>Звіт</button><button><b>🚚</b>Маршрути</button><button class="active"><b>◕</b>Логістика</button><button><b>▤</b>Довідники</button><button><b>•••</b>Меню</button></div></nav></div><div id="sheet" class="sheet hide" onclick="if(event.target===this)closeSheet()"><div class="sheetbox"><h3>Розподілити маршрут</h3><p id="sheetExp"></p><div id="choices" class="choices"></div><button class="ghost" style="width:100%;margin-top:10px" onclick="closeSheet()">Скасувати</button></div></div><script>
const SB='https://ccmwhtojyofefyzespty.supabase.co',KEY='sb_publishable_a5gJ8rAw7dFcJV_iPg4TJg_glZIwMgh';let token=localStorage.trts_token||'',routes=[],points=[],rules=[],manual=[],active='База',selected=null;const TABS=[['База','base'],['STV','stv'],['SAV','sav'],['ФОП','fop'],['Курʼєрські','cour'],['Поповнення філій','branch'],['Пекарня/Фреш','bakery'],['Самовивіз','pickup']];const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const N=n=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:3}).format(Number(n)||0);const M=n=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0}).format(Number(n)||0)+' ₴';const norm=s=>String(s??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim().toLocaleLowerCase('uk-UA');async function api(path,opt={}){let r=await fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){localStorage.removeItem('trts_token');location.reload();throw Error('Сесія завершилась')}if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}async function signIn(){try{let r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})}),j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||'Помилка входу');token=j.access_token;localStorage.trts_token=token;start()}catch(e){loginErr.textContent=e.message}}async function start(){login.classList.add('hide');app.classList.remove('hide');let d=await api('/rest/v1/routes?select=route_date&order=route_date.desc&limit=1');day.value=d[0]?.route_date||new Date().toISOString().slice(0,10);await load()}function ruleMap(){return new Map(rules.map(x=>[norm(x.expeditor_name),x]))}function blockOf(r){let q=ruleMap().get(norm(r.expeditor_name));return q?.target_block||'База'}function byBlock(name){if(name==='Поповнення філій')return [];return routes.filter(r=>blockOf(r)===name)}function routePoints(id){return points.filter(p=>Number(p.route_id)===Number(id))}function totals(rs){let p=rs.flatMap(r=>routePoints(r.id));return{routes:rs.length,tt:p.length,pal:p.reduce((s,x)=>s+(+x.pallets||0),0),weight:p.reduce((s,x)=>s+(+x.weight||0),0),sales:p.reduce((s,x)=>s+(+x.order_amount||0),0)}}async function load(){try{let d=day.value;[routes,rules,manual]=await Promise.all([api('/rest/v1/routes?select=id,route_date,route_delivery_id,expeditor_name,warehouse,total_points,total_documents,total_weight,total_pallets,total_order_amount&route_date=eq.'+d+'&order=route_delivery_id'),api('/rest/v1/transport_expeditor_rules?select=expeditor_name,coverage,target_block&is_active=eq.true'),api('/rest/v1/manual_transport_entries?select=*&entry_date=eq.'+d)]);let ids=routes.map(x=>x.id),q=ids.length?encodeURIComponent('('+ids.join(',')+')'):'';points=ids.length?await api('/rest/v1/route_points?select=id,route_id,customer_name,weight,pallets,order_amount&route_id=in.'+q):[];render()}catch(e){content.innerHTML='<div class="empty">'+E(e.message)+'</div>'}}function counts(){let c={};for(let [n] of TABS)c[n]=n==='Поповнення філій'?manual.filter(x=>x.entry_type==='branch_replenishment').length:byBlock(n).length;return c}function renderTabs(){let c=counts();tabs.innerHTML=TABS.map(([n,cl])=>`<button class="tab ${cl} ${active===n?'active':''}" onclick="active=${JSON.stringify(n)};render()"><b>${E(n)}</b><span>${c[n]}</span></button>`).join('')}function accent(){return({База:'#6481ff',STV:'#63df7b',SAV:'#a66cff','ФОП':'#ff9c35','Курʼєрські':'#f5c044','Поповнення філій':'#42d7c6','Пекарня/Фреш':'#f4c54e','Самовивіз':'#6ce379'})[active]||'#6481ff'}function render(){renderTabs();if(active==='Поповнення філій')return renderBranches();let rs=byBlock(active),t=totals(rs);let extra=active==='STV'?`<div class="monthly"><div class="mh"><div><h3>Міжфілійна доставка</h3><p>Заповнюється один раз на місяць</p></div><span class="tag">Щомісячно</span></div><div class="cols"><span>Маршрут</span><span>Палети</span><span>Сума витрат</span></div></div>`:'';content.innerHTML=`<section class="hero" style="--accent:${accent()}"><h2>${E(active==='База'?'База маршрутів':active)}</h2><div class="sub">${active==='База'?'Тільки нерозподілені маршрути':'Автоматично розподілено за довідником експедиторів'}</div><div class="stats"><div class="stat"><small>Маршрути</small><strong>${t.routes}</strong></div><div class="stat"><small>ТТ</small><strong>${t.tt}</strong></div><div class="stat"><small>Палети</small><strong>${N(t.pal)}</strong></div><div class="stat"><small>Вага, кг</small><strong>${N(t.weight)}</strong></div></div></section>${extra}<div class="toolbar"><button class="ghost">Фільтри</button><button class="ghost">Дата ↓</button></div><div class="list">${rs.length?rs.map(card).join(''):'<div class="empty">У цьому блоці за вибрану дату маршрутів немає</div>'}</div>`;debug.textContent=`Довідник: ${rules.length} експедиторів · Реальні маршрути за ${day.value}: ${routes.length}`}
function card(r){let p=routePoints(r.id),tt=p.length||Number(r.total_points)||0,pal=p.length?p.reduce((s,x)=>s+(+x.pallets||0),0):Number(r.total_pallets)||0,weight=p.length?p.reduce((s,x)=>s+(+x.weight||0),0):Number(r.total_weight)||0,sales=p.length?p.reduce((s,x)=>s+(+x.order_amount||0),0):Number(r.total_order_amount)||0;return `<article class="route" style="--accent:${accent()}"><div class="row"><div class="code">Маршрут ${E(r.route_delivery_id||r.id)}</div><div class="date">${E(String(r.route_date||'').slice(8,10)+'.'+String(r.route_date||'').slice(5,7))}</div></div><div class="exp">${E(r.expeditor_name||'Без експедитора')}</div><div class="wh">${E(r.warehouse||'Склад не визначено')}</div><div class="mini"><span>ТТ: <b>${tt}</b></span><span>Палети: <b>${N(pal)}</b></span><span>Вага: <b>${N(weight)}</b></span><span>Сума: <b>${M(sales)}</b></span></div>${active==='База'?`<div class="actions"><button class="assign" onclick='openSheet(${JSON.stringify(r.id)})'>Розподілити</button></div>`:''}</article>`}
function renderBranches(){let arr=manual.filter(x=>x.entry_type==='branch_replenishment'),pal=arr.reduce((s,x)=>s+(+x.pallets||0),0),cost=arr.reduce((s,x)=>s+(+x.expense_amount||0),0);content.innerHTML=`<section class="hero" style="--accent:${accent()}"><h2>Поповнення філій</h2><div class="sub">Окремий блок переміщень між складами та філіями</div><div class="stats"><div class="stat"><small>Переміщення</small><strong>${arr.length}</strong></div><div class="stat"><small>Палети</small><strong>${N(pal)}</strong></div><div class="stat"><small>Витрати</small><strong>${M(cost)}</strong></div><div class="stat"><small>Статус</small><strong>${arr.length?'Є дані':'—'}</strong></div></div></section><div class="list">${arr.length?arr.map(x=>`<article class="route" style="--accent:${accent()}"><div class="exp">${E(x.sender_warehouse||'—')} → ${E(x.receiver_branch||'—')}</div><div class="mini"><span>Палети: <b>${N(x.pallets)}</b></span><span>Витрати: <b>${M(x.expense_amount)}</b></span></div></article>`).join(''):'<div class="empty">Поповнення філій за цю дату не внесено</div>'}</div>`;debug.textContent=`Ручні записи поповнення філій: ${arr.length}`}
function openSheet(id){selected=routes.find(x=>Number(x.id)===Number(id));sheetExp.textContent=selected?.expeditor_name||'';choices.innerHTML=TABS.filter(([n])=>!['База','Поповнення філій'].includes(n)).map(([n,cl])=>`<button class="choice" onclick='assign(${JSON.stringify(n)})'>${E(n)}</button>`).join('');sheet.classList.remove('hide')}function closeSheet(){sheet.classList.add('hide');selected=null}async function assign(block){if(!selected)return;try{let cov=block==='Курʼєрські'?"Кур'єр":block==='Пекарня/Фреш'?'Пекарня':block;await api('/rest/v1/transport_expeditor_rules?on_conflict=expeditor_name',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify([{expeditor_name:selected.expeditor_name,coverage:cov,target_block:block,is_active:true}])});closeSheet();await load()}catch(e){alert('Не вдалося зберегти правило: '+e.message)}}if(token)start();
</script><script src="./patch-v37.js?v=437"></script><script src="./patch-v38.js?v=437"></script><script src="./reference-v39.js?v=437"></script><script src="./patch-v39.js?v=437"></script><script src="./patch-v39-fix.js?v=437"></script><script src="./patch-v39-bottles.js?v=437"></script><script src="./patch-v39-route-fields.js?v=437"></script><script src="./patch-v40-pickup.js?v=437"></script><script src="./patch-v41-datafix.js?v=437"></script><script src="./patch-v41-sections.js?v=437"></script><script src="./patch-v41-employee-names.js?v=437"></script><script src="./patch-v41-mobile-scale.js?v=437"></script><script src="./patch-v41-route-scale.js?v=437"></script><script src="./patch-v43-operations.js?v=437"></script><script src="./patch-v43-1-blocks.js?v=437"></script><script src="./patch-v43-1-header.js?v=437"></script><script src="./patch-v43-1-ops-courier.js?v=437"></script><script src="./patch-v43-7-pickup-cards.js?v=437"></script></body></html>
