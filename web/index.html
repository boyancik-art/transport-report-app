<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20242b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Transport TS"><title>Transport Report TS</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png"><style>:root{--bg:#f3f4f6;--panel:#fff;--ink:#181a1f;--muted:#737985;--line:#e5e7eb;--accent:#8f1d2c;--dark:#20242b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#eef0f2,#f8f8f9);color:var(--ink)}button,input,select{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginbox{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 20px 50px #0002;text-align:center}.logo{width:82px;height:82px;border-radius:20px}.loginbox input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;margin:6px 0}.btn{border:0;border-radius:11px;padding:12px 15px;background:var(--accent);color:white;font-weight:800;cursor:pointer}.loginbox .btn{width:100%;margin-top:10px}.top{height:72px;background:var(--dark);color:#fff;display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:10}.top .logo{width:44px;height:44px;border-radius:12px}.brand{font-weight:900}.sub{font-size:12px;color:#c8ccd2}.nav{margin-left:auto;display:flex;gap:7px}.nav button{border:0;border-radius:10px;padding:9px 12px;background:#343941;color:#fff;cursor:pointer}.nav button.active{background:var(--accent)}.wrap{max-width:1380px;margin:auto;padding:22px}.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.filters input,.filters select{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}.tag{padding:6px 9px;border-radius:9px;background:#f3e5e7;color:var(--accent);font-size:12px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 20px #0000000b}.kpi{padding:17px;min-height:120px}.label{font-size:13px;color:var(--muted);font-weight:700}.val{font-size:27px;font-weight:900;margin-top:8px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:16px}.box{padding:18px}.cost{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.cost:last-child{border:0}.note{font-size:12px;color:var(--muted);line-height:1.55}.warn{background:#fff9e8;border-color:#ead9a9}.tablecard{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;color:var(--muted);text-transform:uppercase;background:#fafafa}.section{margin-top:18px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.err{color:#bb2634}.install{margin-left:8px;background:#fff!important;color:#20242b!important}@media(max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.nav{display:none}}@media(max-width:620px){.wrap{padding:12px}.kpis{grid-template-columns:repeat(2,1fr)}.val{font-size:23px}.top{padding:0 12px}}</style></head><body><div id="login" class="login"><div class="loginbox"><img class="logo" src="/icon.png"><h1>Transport Report TS</h1><p class="note">Тестова управлінська версія на реальних даних компанії</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button class="btn" onclick="signIn()">Увійти</button><p id="loginErr" class="err"></p></div></div><div id="app" class="hide"><div class="top"><img class="logo" src="/icon.png"><div><div class="brand">Transport Report TS</div><div class="sub">Management Control Tower · TEST</div></div><div class="nav"><button class="active" onclick="showHome(this)">Головна</button><button onclick="showRoutes(this)">Маршрути</button></div><button id="installBtn" class="btn install hide">Встановити</button><button class="btn" style="margin-left:8px" onclick="logout()">Вийти</button></div><main class="wrap"><div class="filters"><input id="date" type="date"><button class="btn" onclick="loadAll()">Оновити</button><span id="dataTag" class="tag"></span></div><div id="view"></div></main></div><script>const SB='https://ccmwhtojyofefyzespty.supabase.co',KEY='sb_publishable_a5gJ8rAw7dFcJV_iPg4TJg_glZIwMgh';let token=localStorage.trts_token||'',data={routes:[],points:[],facts:[]},deferredPrompt=null;const fmt=n=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:1}).format(Number(n||0)),money=n=>new Intl.NumberFormat('uk-UA',{maximumFractionDigits:0}).format(Number(n||0))+' грн';window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.classList.remove('hide')});installBtn.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.classList.add('hide')};if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');async function api(path){const r=await fetch(SB+path,{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(r.status===401){logout();throw Error('Сесія завершилась')}if(!r.ok)throw Error(await r.text());return r.json()}async function signIn(){loginErr.textContent='';try{const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||'Помилка входу');token=j.access_token;localStorage.trts_token=token;start()}catch(e){loginErr.textContent=e.message}}function logout(){localStorage.removeItem('trts_token');token='';app.classList.add('hide');login.classList.remove('hide')}async function start(){login.classList.add('hide');app.classList.remove('hide');const r=await api('/rest/v1/routes?select=route_date&order=route_date.desc&limit=1');date.value=r[0]?.route_date||new Date().toISOString().slice(0,10);loadAll()}async function loadAll(){try{const d=date.value;dataTag.textContent='Дані: '+d;const routes=await api('/rest/v1/routes?select=id,route_delivery_id,expeditor_name,warehouse,total_points,total_pallets,total_order_amount&route_date=eq.'+d);let points=[],facts=[];if(routes.length){const q=encodeURIComponent('('+routes.map(x=>x.id).join(',')+')');[points,facts]=await Promise.all([api('/rest/v1/route_points?select=id,route_id,customer_name,documents_count,weight,pallets,order_amount,point_delivery_cost&route_id=in.'+q),api('/rest/v1/route_facts?select=route_id,carrier_name,wave,tariff,tariff_unknown,departure_time,delivered_points&route_id=in.'+q)])}data={routes,points,facts};showHome(document.querySelector('.nav button'))}catch(e){view.innerHTML='<div class="card box err">Помилка: '+e.message+'</div>'}}function showHome(btn){setActive(btn);const tt=data.points.length,pal=data.points.reduce((s,x)=>s+Number(x.pallets||0),0),sales=data.points.reduce((s,x)=>s+Number(x.order_amount||0),0),cost=data.facts.reduce((s,x)=>s+Number(x.tariff||0),0),stv=data.facts.filter(x=>/stv|sav/i.test(x.carrier_name||'')).reduce((s,x)=>s+Number(x.tariff||0),0),local=cost-stv,unknown=data.facts.filter(x=>x.tariff_unknown).length;view.innerHTML='<div class="kpis">'+k('К-ть ТТ',fmt(tt))+k('К-ть палет',fmt(pal))+k('Продажі',money(sales))+k('Витрати',money(cost))+k('Логістика',sales?(cost/sales*100).toFixed(2)+'%':'—')+k('1 ТТ',tt?money(cost/tt):'—')+'</div><div class="grid2"><div class="card box"><div class="head"><h2>Структура витрат</h2><b>'+money(cost)+'</b></div>'+c('Локальна доставка',local)+c('STV / SAV',stv)+c('Кур’єрська доставка',0)+c('Поповнення філій',0)+'</div><div class="card box warn"><h2>Контроль даних</h2><p><b>'+data.routes.length+'</b> маршрутів</p><p><b>'+tt+'</b> ТТ</p><p><b>'+unknown+'</b> маршрутів без тарифу</p><p class="note">STV/SAV зараз показує лише вже внесені фактичні тарифи. Перед фінальним фінансовим тестом підключаємо точний зональний розрахунок по кожній ТТ.</p></div></div>'}function showRoutes(btn){setActive(btn);let rows=data.routes.map(r=>{const f=data.facts.find(x=>x.route_id===r.id)||{};const pts=data.points.filter(x=>x.route_id===r.id);return '<tr><td><b>'+esc(r.route_delivery_id||r.id)+'</b></td><td>'+esc(r.expeditor_name||'—')+'</td><td>'+esc(r.warehouse||'—')+'</td><td>'+pts.length+'</td><td>'+fmt(pts.reduce((s,x)=>s+Number(x.pallets||0),0))+'</td><td>'+money(pts.reduce((s,x)=>s+Number(x.order_amount||0),0))+'</td><td>'+esc(f.carrier_name||'—')+'</td><td>'+money(f.tariff||0)+'</td></tr>'}).join('');view.innerHTML='<div class="head"><h2>Маршрути</h2><span class="tag">'+data.routes.length+' маршрутів</span></div><div class="card tablecard"><table class="table"><thead><tr><th>Маршрут</th><th>Експедитор</th><th>Склад</th><th>ТТ</th><th>Палети</th><th>Продажі</th><th>Перевізник</th><th>Тариф</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}function setActive(btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active')}function k(a,b){return '<div class="card kpi"><div class="label">'+a+'</div><div class="val">'+b+'</div></div>'}function c(a,b){return '<div class="cost"><span>'+a+'</span><b>'+money(b)+'</b></div>'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(token)start();</script></body></html>
