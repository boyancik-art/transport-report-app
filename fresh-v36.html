<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d13"><title>Transport Report TS</title><style>html,body{margin:0;min-height:100%;background:#090d13;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{text-align:center}.mark{width:56px;height:56px;margin:0 auto 18px;border-radius:18px;background:linear-gradient(135deg,#5f7cff,#41c7b5);display:grid;place-items:center;font-weight:950;font-size:20px;box-shadow:0 18px 50px #0008}.title{font-size:20px;font-weight:900}.note{margin-top:8px;color:#8f9bad;font-size:13px}.spin{width:28px;height:28px;border:3px solid #ffffff20;border-top-color:#6f8cff;border-radius:50%;margin:22px auto 0;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="mark">TS</div><div class="title">Transport Report TS</div><div class="note">Оновлюємо тестову версію…</div><div class="spin"></div></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}localStorage.removeItem('trts_ui_version')}catch(e){}location.replace('./?v=36&fresh='+Date.now())})()</script></body></html>
