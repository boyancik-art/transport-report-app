name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-stv-sav:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch STV SAV route tariff aggregation
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "No source patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Fix STV SAV route tariff aggregation"
          git push

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Ensure platform folders exist
        run: flutter create . --platforms=android,ios --project-name transport_report_app --org com.transportreport
      - name: Apply Transport Report TS branding
        run: bash tool/apply_branding.sh
      - name: Remove generated default test
        run: rm -rf test
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build Android APK (demo mode)
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: transport-report-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Ensure iOS platform exists
        run: flutter create . --platforms=ios --project-name transport_report_app --org com.transportreport
      - name: Apply Transport Report TS branding
        run: bash tool/apply_branding.sh
      - name: Remove generated default test
        run: rm -rf test
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        run: |
          cd build/ios/iphoneos
          zip -r ../../../transport-report-ios-unsigned.zip Runner.app
      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: transport-report-ios-unsigned
          path: transport-report-ios-unsigned.zip
          if-no-files-found: error
