name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Ensure platform folders exist
        run: flutter create . --platforms=android,ios --project-name transport_report_app --org com.transportreport
      - name: Remove generated default test
        run: rm -rf test
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build Android APK (demo mode)
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: transport-report-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Ensure iOS platform exists
        run: flutter create . --platforms=ios --project-name transport_report_app --org com.transportreport
      - name: Remove generated default test
        run: rm -rf test
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        run: |
          cd build/ios/iphoneos
          zip -r ../../../transport-report-ios-unsigned.zip Runner.app
      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: transport-report-ios-unsigned
          path: transport-report-ios-unsigned.zip
          if-no-files-found: error
