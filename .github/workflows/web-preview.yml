name: Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure web platform exists
        run: flutter create . --platforms=web --project-name transport_report_app --org com.transportreport
      - name: Apply Transport Report TS branding
        run: bash tool/apply_branding.sh
      - name: Remove generated default test
        run: rm -rf test
      - name: Install dependencies
        run: flutter pub get
      - name: Build web preview
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            flutter build web --release --base-href /transport-report-app/ \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          else
            echo "Supabase secrets are not set; building demo mode."
            flutter build web --release --base-href /transport-report-app/
          fi
      - name: Disable Jekyll
        run: touch build/web/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
