name: Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-migration

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/pages/projects';
          const headers = { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, 'Content-Type': 'application/json' };
          const name = 'transport-report-ts-web';
          const check = await fetch(base + '/' + name, { headers });
          const current = await check.json();
          if (check.ok && current.success) {
            console.log('Pages project already exists');
          } else if (current.errors?.some(e => e.code === 8000007)) {
            const created = await fetch(base, { method: 'POST', headers, body: JSON.stringify({ name, production_branch: 'cloudflare-migration' }) });
            const result = await created.json();
            if (!created.ok || !result.success) throw new Error('Pages project creation failed: ' + JSON.stringify(result.errors));
            console.log('Pages project created');
          } else {
            throw new Error('Pages project lookup failed: ' + JSON.stringify(current.errors));
          }
          NODE

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=transport-report-ts-web --branch=cloudflare-migration
