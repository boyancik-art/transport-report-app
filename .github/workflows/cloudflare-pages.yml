name: Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-migration

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Test mobile operation flows
        run: |
          npm install --prefix /tmp/trts-ui-tests --no-package-lock playwright@1.58.2
          /tmp/trts-ui-tests/node_modules/.bin/playwright install --with-deps chromium
          TRTS_PLAYWRIGHT_MODULE=/tmp/trts-ui-tests/node_modules/playwright node tool/mobile-regression.cjs

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/pages/projects';
          const headers = { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, 'Content-Type': 'application/json' };
          const name = 'transport-report-ts-web';
          const check = await fetch(base + '/' + name, { headers });
          const current = await check.json();
          if (check.ok && current.success) {
            console.log('Pages project already exists');
          } else if (current.errors?.some(e => e.code === 8000007)) {
            const created = await fetch(base, { method: 'POST', headers, body: JSON.stringify({ name, production_branch: 'cloudflare-migration' }) });
            const result = await created.json();
            if (!created.ok || !result.success) throw new Error('Pages project creation failed: ' + JSON.stringify(result.errors));
            console.log('Pages project created');
          } else {
            throw new Error('Pages project lookup failed: ' + JSON.stringify(current.errors));
          }
          NODE

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=transport-report-ts-web --branch=cloudflare-migration

      - name: Verify published HTTPS site
        run: |
          curl --fail --show-error --silent --location --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 10 --max-time 20 https://transport-report-ts-web.pages.dev/ -o /tmp/pages-index.html
          grep -qi 'Transport Report' /tmp/pages-index.html
          echo 'HTTPS and application HTML verified: https://transport-report-ts-web.pages.dev'
          curl --fail --show-error --silent --location --connect-timeout 10 --max-time 20 https://937024cd.transport-report-ts-web.pages.dev/ -o /tmp/original-deploy.html
          grep -qi 'Transport Report' /tmp/original-deploy.html
          echo 'Original deployment HTTPS verified'

