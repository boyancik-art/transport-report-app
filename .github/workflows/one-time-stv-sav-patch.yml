name: One time exact TT invoice mapping patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          marker = "final pointDocs = point.addressId.isNotEmpty"
          if marker in s:
              print('Exact TT invoice mapping already patched')
              raise SystemExit(0)

          replacements = [
            (
              "class RoutePointModel {\n  RoutePointModel({\n    required this.id,\n    required this.customer,",
              "class RoutePointModel {\n  RoutePointModel({\n    required this.id,\n    required this.addressId,\n    required this.customer,"
            ),
            (
              "  final int id;\n  final String customer;",
              "  final int id;\n  final String addressId;\n  final String customer;"
            ),
            (
              "RoutePointModel(id: 1, customer: 'ТОВ Приклад'",
              "RoutePointModel(id: 1, addressId: 'A1', customer: 'ТОВ Приклад'"
            ),
            (
              "        id: (r['id'] as num).toInt(),\n        customer:",
              "        id: (r['id'] as num).toInt(),\n        addressId: '${loc['address_id'] ?? r['address_id'] ?? ''}',\n        customer:"
            ),
            (
              "    final pointDocs = documents.where((d) => d.customer == point.customer || d.addressId.isEmpty).toList();",
              "    final pointDocs = point.addressId.isNotEmpty\n        ? documents.where((d) => d.addressId == point.addressId).toList()\n        : documents.where((d) => d.customer == point.customer).toList();"
            ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'target not found: {old[:70]}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Fix exact TT to invoice mapping by address ID"
          git push
