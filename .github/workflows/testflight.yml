name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/testflight.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.35.2'
  BUNDLE_ID: com.transportreport.transportreportts
  APP_NAME: Transport Report TS
  APPLE_TEAM_ID: L7347GB8DM

jobs:
  upload-testflight:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Force CocoaPods plugin integration
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager

      - name: Ensure iOS platform exists
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create . --platforms=ios --project-name transport_report_app --org com.transportreport
          fi

      - name: Apply Transport Report TS branding
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${APP_NAME}" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${APP_NAME}" ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update

      - name: Verify secure storage pod integration
        run: |
          set -euo pipefail
          grep -i "flutter_secure_storage" ios/Podfile.lock

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "Missing App Store Connect API secrets."
            exit 1
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Create export options
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive signed iOS app
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          rm -rf build/Runner.xcarchive build/ipa
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive 2>&1 | tee "$RUNNER_TEMP/xcode-archive.log"
          test ${PIPESTATUS[0]} -eq 0

      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          mkdir -p build/ipa
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/Runner.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist "$PWD/ios/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/xcode-export.log"
          test ${PIPESTATUS[0]} -eq 0
          ls -la build/ipa
          test -n "$(find build/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-xcode-diagnostics
          path: |
            ${{ runner.temp }}/xcode-archive.log
            ${{ runner.temp }}/xcode-export.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: transport-report-ts-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
