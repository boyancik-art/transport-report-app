name: Cube bridge preflight tests
on:
  push:
    branches: [cube-sync-preflight]
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem tools/cube-sync-preflight/*.ps1 | ForEach-Object {
            $tokens=$null; $parseErrors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Host $_.Extent.StartLineNumber $_.Message }; throw "Parse failed: $($_.Name)" }
          }
      - name: Core mapping validation in English and Ukrainian cultures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach($culture in @('en-US','uk-UA')) {
            [Threading.Thread]::CurrentThread.CurrentCulture=[Globalization.CultureInfo]::GetCultureInfo($culture)
            & ./tools/cube-sync-preflight/Test-BridgeCore.ps1
          }
      - name: Missing source fails closed with no upload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runDirectory=Join-Path $env:TEMP ([guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runDirectory | Out-Null
          & powershell.exe -NoProfile -STA -File ./tools/cube-sync-preflight/Excel-Preflight.ps1 -RunDirectory $runDirectory
          if($LASTEXITCODE -ne 1) { throw 'Missing workbook must fail' }
          $report=Get-Content (Join-Path $runDirectory 'report.json') -Raw | ConvertFrom-Json
          if($report.status -ne 'error' -or $report.productionWrites -ne 0 -or $report.uploadedRows -ne 0) { throw 'Unsafe failure state' }
          if(Test-Path (Join-Path $runDirectory 'payload.dpapi')) { throw 'Failed run must not create payload' }
          Write-Host 'Missing workbook fails closed; no payload or production writes.'
          exit 0
