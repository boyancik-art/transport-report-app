name: Patch route TT and invoice details

on:
  push:
    paths:
      - '.github/workflows/patch-route-details.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch route details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()

          if 'class RouteDocumentModel {' not in s:
              marker = 'class DemoData {'
              models = r'''class RouteDocumentModel {
  const RouteDocumentModel({
    required this.number,
    required this.businessUnit,
    required this.weight,
    required this.pallets,
    required this.bottles,
    required this.places,
    required this.orderAmount,
  });

  final String number;
  final String businessUnit;
  final double weight;
  final double pallets;
  final double bottles;
  final double places;
  final double orderAmount;
}

class RoutePointDetail {
  const RoutePointDetail({
    required this.customerName,
    required this.address,
    required this.settlement,
    required this.region,
    required this.documentsCount,
    required this.weight,
    required this.pallets,
    required this.orderAmount,
    required this.documents,
  });

  final String customerName;
  final String address;
  final String settlement;
  final String region;
  final int documentsCount;
  final double weight;
  final double pallets;
  final double orderAmount;
  final List<RouteDocumentModel> documents;
}

'''
              s = s.replace(marker, models + marker, 1)

          if 'Future<List<RoutePointDetail>> loadRoutePoints' not in s:
              marker = '  Future<void> claimRoute(RouteModel route) async {'
              method = r'''  Future<List<RoutePointDetail>> loadRoutePoints(RouteModel route) async {
    if (demo) {
      return const [
        RoutePointDetail(
          customerName: 'Тестова ТТ',
          address: 'м. Київ, вул. Прикладна, 10',
          settlement: 'Київ',
          region: 'Київ',
          documentsCount: 2,
          weight: 240,
          pallets: 1,
          orderAmount: 28400,
          documents: [
            RouteDocumentModel(number: '12345678', businessUnit: 'HoReCa', weight: 120, pallets: .5, bottles: 24, places: 3, orderAmount: 12500),
            RouteDocumentModel(number: '12345691', businessUnit: 'Distribution', weight: 120, pallets: .5, bottles: 18, places: 2, orderAmount: 15900),
          ],
        ),
      ];
    }

    final c = Supabase.instance.client;
    final pointsRaw = await c
        .from('route_points')
        .select('id,customer_id,customer_name,documents_count,weight,pallets,bottles,places,order_amount,location_id,locations(address_id,delivery_address,settlement,district,region)')
        .eq('route_id', route.id)
        .order('id');

    final docsRaw = await c
        .from('source_documents')
        .select('address_id,customer_id,sale_code,operation_group_id,operation_code,business_unit,weight,pallets,bottles,places,order_amount')
        .eq('document_date', DateFormat('yyyy-MM-dd').format(route.routeDate))
        .eq('route_delivery_id', route.routeDeliveryId);

    final docsByPoint = <String, List<RouteDocumentModel>>{};
    for (final raw in (docsRaw as List)) {
      final d = Map<String, dynamic>.from(raw as Map);
      final addressId = '${d['address_id'] ?? ''}';
      final customerId = '${d['customer_id'] ?? ''}';
      final key = '$addressId|$customerId';
      final number = '${d['sale_code'] ?? ''}'.trim().isNotEmpty
          ? '${d['sale_code']}'
          : ('${d['operation_group_id'] ?? ''}'.trim().isNotEmpty
              ? '${d['operation_group_id']}'
              : '${d['operation_code'] ?? 'Без номера'}');
      docsByPoint.putIfAbsent(key, () => <RouteDocumentModel>[]).add(
        RouteDocumentModel(
          number: number,
          businessUnit: '${d['business_unit'] ?? ''}',
          weight: (d['weight'] as num? ?? 0).toDouble(),
          pallets: (d['pallets'] as num? ?? 0).toDouble(),
          bottles: (d['bottles'] as num? ?? 0).toDouble(),
          places: (d['places'] as num? ?? 0).toDouble(),
          orderAmount: (d['order_amount'] as num? ?? 0).toDouble(),
        ),
      );
    }

    final result = <RoutePointDetail>[];
    for (final raw in (pointsRaw as List)) {
      final p = Map<String, dynamic>.from(raw as Map);
      final locRaw = p['locations'];
      final loc = locRaw is Map ? Map<String, dynamic>.from(locRaw) : <String, dynamic>{};
      final addressId = '${loc['address_id'] ?? ''}';
      final customerId = '${p['customer_id'] ?? ''}';
      final key = '$addressId|$customerId';
      final docs = docsByPoint[key] ?? const <RouteDocumentModel>[];
      result.add(RoutePointDetail(
        customerName: '${p['customer_name'] ?? ''}',
        address: '${loc['delivery_address'] ?? ''}',
        settlement: '${loc['settlement'] ?? ''}',
        region: '${loc['region'] ?? ''}',
        documentsCount: (p['documents_count'] as num? ?? docs.length).toInt(),
        weight: (p['weight'] as num? ?? 0).toDouble(),
        pallets: (p['pallets'] as num? ?? 0).toDouble(),
        orderAmount: (p['order_amount'] as num? ?? 0).toDouble(),
        documents: docs,
      ));
    }
    return result;
  }

'''
              s = s.replace(marker, method + marker, 1)

          if 'late Future<List<RoutePointDetail>> pointsFuture;' not in s:
              old = "  bool tariffUnknown = false;\n  bool saving = false;"
              new = "  bool tariffUnknown = false;\n  bool saving = false;\n  late Future<List<RoutePointDetail>> pointsFuture;"
              if old not in s:
                  raise SystemExit('state fields anchor not found')
              s = s.replace(old, new, 1)

              old = "    wave = widget.route.wave ?? '24';\n    tariffUnknown = widget.route.tariffUnknown;"
              new = "    wave = widget.route.wave ?? '24';\n    tariffUnknown = widget.route.tariffUnknown;\n    pointsFuture = widget.repo.loadRoutePoints(widget.route);"
              if old not in s:
                  raise SystemExit('initState anchor not found')
              s = s.replace(old, new, 1)

          if "Text('Точки доставки'" not in s:
              anchor = "          const SizedBox(height: 16),\n          Text('Фактичні дані логіста',"
              block = r'''          const SizedBox(height: 18),
          Row(
            children: [
              Expanded(
                child: Text('Точки доставки',
                    style: Theme.of(context)
                        .textTheme
                        .titleMedium
                        ?.copyWith(fontWeight: FontWeight.w900)),
              ),
              Text('${r.points} ТТ',
                  style: const TextStyle(
                      color: Color(0xFF6C778A), fontWeight: FontWeight.w700)),
            ],
          ),
          const SizedBox(height: 10),
          FutureBuilder<List<RoutePointDetail>>(
            future: pointsFuture,
            builder: (context, snapshot) {
              if (snapshot.connectionState == ConnectionState.waiting) {
                return const Card(
                  child: Padding(
                    padding: EdgeInsets.all(20),
                    child: Center(child: CircularProgressIndicator()),
                  ),
                );
              }
              if (snapshot.hasError) {
                return Card(
                  child: Padding(
                    padding: const EdgeInsets.all(16),
                    child: Text('Не вдалося завантажити ТТ: ${snapshot.error}'),
                  ),
                );
              }
              final points = snapshot.data ?? const <RoutePointDetail>[];
              if (points.isEmpty) {
                return const Card(
                  child: Padding(
                    padding: EdgeInsets.all(16),
                    child: Text('Для маршруту немає деталізації ТТ.'),
                  ),
                );
              }
              return Column(
                children: [
                  for (final point in points) ...[
                    Card(
                      child: ExpansionTile(
                        leading: const CircleAvatar(
                          backgroundColor: Color(0xFFE7F0FF),
                          child: Icon(Icons.storefront_outlined,
                              color: Color(0xFF1677FF)),
                        ),
                        title: Text(
                          point.customerName.isEmpty ? 'Точка доставки' : point.customerName,
                          style: const TextStyle(fontWeight: FontWeight.w800),
                        ),
                        subtitle: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            if (point.address.isNotEmpty) Text(point.address),
                            const SizedBox(height: 4),
                            Text(
                              '${point.documentsCount} накл. · ${nf0(point.weight)} кг · ${nf0(point.pallets)} пал. · ${money0(point.orderAmount)} грн',
                              style: const TextStyle(fontSize: 12),
                            ),
                          ],
                        ),
                        childrenPadding: const EdgeInsets.fromLTRB(16, 0, 16, 14),
                        children: [
                          if (point.settlement.isNotEmpty || point.region.isNotEmpty)
                            Padding(
                              padding: const EdgeInsets.only(bottom: 10),
                              child: Align(
                                alignment: Alignment.centerLeft,
                                child: Text(
                                  [point.settlement, point.region]
                                      .where((e) => e.trim().isNotEmpty)
                                      .join(' · '),
                                  style: const TextStyle(color: Color(0xFF6C778A)),
                                ),
                              ),
                            ),
                          if (point.documents.isEmpty)
                            const Align(
                              alignment: Alignment.centerLeft,
                              child: Text('Номери накладних не знайдено'),
                            ),
                          for (final doc in point.documents)
                            Container(
                              margin: const EdgeInsets.only(bottom: 8),
                              padding: const EdgeInsets.all(12),
                              decoration: BoxDecoration(
                                color: const Color(0xFFF6F8FC),
                                borderRadius: BorderRadius.circular(12),
                              ),
                              child: Row(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  const Icon(Icons.description_outlined,
                                      size: 18, color: Color(0xFF1677FF)),
                                  const SizedBox(width: 9),
                                  Expanded(
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        Text('№ ${doc.number}',
                                            style: const TextStyle(
                                                fontWeight: FontWeight.w800)),
                                        if (doc.businessUnit.isNotEmpty)
                                          Text(doc.businessUnit,
                                              style: const TextStyle(
                                                  color: Color(0xFF6C778A),
                                                  fontSize: 12)),
                                        const SizedBox(height: 3),
                                        Text(
                                          '${nf0(doc.weight)} кг · ${nf0(doc.pallets)} пал. · ${nf0(doc.bottles)} пл. · ${nf0(doc.places)} місць',
                                          style: const TextStyle(fontSize: 12),
                                        ),
                                      ],
                                    ),
                                  ),
                                  const SizedBox(width: 8),
                                  Text('${money0(doc.orderAmount)} грн',
                                      style: const TextStyle(
                                          fontWeight: FontWeight.w800)),
                                ],
                              ),
                            ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 10),
                  ],
                ],
              );
            },
          ),

'''
              if anchor not in s:
                  raise SystemExit('details UI anchor not found')
              s = s.replace(anchor, block + anchor, 1)

          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Show route TT and invoice details"
          git push
