name: TestFlight Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'tool/**'
      - '.github/workflows/testflight-production.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.35.2'
  BUNDLE_ID: com.transportreport.transportreportts
  APP_NAME: Transport Report TS
  APPLE_TEAM_ID: L7347GB8DM
  SUPABASE_URL: https://ccmwhtojyofefyzespty.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_a5gJ8rAw7dFcJV_iPg4TJg_glZIwMgh

jobs:
  upload-testflight-production:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Force CocoaPods plugin integration
        run: flutter config --no-enable-swift-package-manager

      - name: Ensure iOS platform exists
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            flutter create . --platforms=ios --project-name transport_report_app --org com.transportreport
          fi

      - name: Apply branding and production iOS settings
        run: |
          set -euo pipefail
          chmod +x tool/apply_branding.sh
          ./tool/apply_branding.sh
          test -f ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" ios/Runner/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Runner/Info.plist
          sed -i '' 's/platform :ios, .*/platform :ios, '\''15.0'\''/' ios/Podfile || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update

      - name: Verify production configuration
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          grep -i "flutter_secure_storage" ios/Podfile.lock
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" ios/Runner/Info.plist

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Create export options
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

      - name: Configure automatic signing
        run: |
          set -euo pipefail
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com\.transportreport\.transportReportApp;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com\.transportreport\.transport_report_app;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' "s/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = ${APPLE_TEAM_ID};/g" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Prepare production Flutter iOS build
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=39 \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Archive signed iOS app
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          rm -rf build/ios/archive/Runner.xcarchive
          mkdir -p build/ios/archive
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcode-archive.log"
          test ${PIPESTATUS[0]} -eq 0

      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          rm -rf build/ios/ipa && mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportPath "$PWD/build/ios/ipa" \
            -exportOptionsPlist "$PWD/ios/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/xcode-export.log"
          test ${PIPESTATUS[0]} -eq 0
          IPA_PATH="$(/usr/bin/find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: transport-report-ts-production-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/altool-upload.log"
          upload_ok=0
          for attempt in 1 2 3; do
            echo "=== TestFlight production upload attempt ${attempt}/3 ===" | tee -a "$RUNNER_TEMP/altool-upload.log"
            set +e
            xcrun altool --upload-app --type ios --file "$IPA_PATH" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
              2>&1 | tee -a "$RUNNER_TEMP/altool-upload.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then upload_ok=1; break; fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          test "$upload_ok" -eq 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-production-diagnostics
          path: |
            ${{ runner.temp }}/xcode-archive.log
            ${{ runner.temp }}/xcode-export.log
            ${{ runner.temp }}/altool-upload.log
          if-no-files-found: ignore
          retention-days: 90
