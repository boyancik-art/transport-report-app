name: Patch route warehouse and region filters

on:
  push:
    paths:
      - '.github/workflows/patch-route-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch route filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          start = s.index('class RoutesPage extends StatefulWidget')
          end = s.index('class RouteCard extends StatelessWidget')
          new = r'''class RoutesPage extends StatefulWidget {
  const RoutesPage(
      {required this.repo, required this.date, required this.demo, super.key});
  final RouteRepository repo;
  final DateTime date;
  final bool demo;

  @override
  State<RoutesPage> createState() => _RoutesPageState();
}

class _RoutesPageState extends State<RoutesPage> {
  late Future<List<RouteModel>> future;
  final search = TextEditingController();
  String filter = 'Всі';
  bool groupByExpeditor = false;
  String? warehouseFilter;
  String? regionFilter;

  @override
  void initState() {
    super.initState();
    future = widget.repo.loadRoutes(widget.date);
    search.addListener(_searchChanged);
  }

  void _searchChanged() {
    if (mounted) setState(() {});
  }

  @override
  void dispose() {
    search.removeListener(_searchChanged);
    search.dispose();
    super.dispose();
  }

  @override
  void didUpdateWidget(covariant RoutesPage oldWidget) {
    super.didUpdateWidget(oldWidget);
    if (!DateUtils.isSameDay(oldWidget.date, widget.date)) {
      warehouseFilter = null;
      regionFilter = null;
      future = widget.repo.loadRoutes(widget.date);
    }
  }

  void reload() => setState(() => future = widget.repo.loadRoutes(widget.date));

  List<RouteModel> _filtered(List<RouteModel> source) {
    var routes = List<RouteModel>.from(source);
    if (filter == 'Заповнено') {
      routes = routes.where((r) => r.completed).toList();
    }
    if (filter == 'Без тарифу') {
      routes = routes.where((r) => r.tariff == null || r.tariffUnknown).toList();
    }
    if (warehouseFilter != null) {
      routes = routes.where((r) => r.warehouse == warehouseFilter).toList();
    }
    if (regionFilter != null) {
      routes = routes
          .where((r) => shippingRegion(r.warehouse) == regionFilter)
          .toList();
    }
    final q = search.text.trim().toLowerCase();
    if (q.isNotEmpty) {
      routes = routes.where((r) {
        return r.expeditor.toLowerCase().contains(q) ||
            r.routeDeliveryId.toLowerCase().contains(q) ||
            r.warehouse.toLowerCase().contains(q) ||
            shippingRegion(r.warehouse).toLowerCase().contains(q);
      }).toList();
    }
    return routes;
  }

  @override
  Widget build(BuildContext context) {
    return SafeArea(
      child: Column(
        children: [
          PageHeader(
            title: 'Маршрути',
            subtitle: DateFormat('dd.MM.yyyy').format(widget.date),
            trailing: IconButton(
                onPressed: reload, icon: const Icon(Icons.refresh)),
          ),
          Padding(
            padding: const EdgeInsets.fromLTRB(20, 0, 20, 10),
            child: TextField(
              controller: search,
              decoration: InputDecoration(
                hintText: 'Пошук: експедитор, ID, склад, регіон',
                prefixIcon: const Icon(Icons.search),
                suffixIcon: search.text.isEmpty
                    ? null
                    : IconButton(
                        onPressed: search.clear,
                        icon: const Icon(Icons.close),
                      ),
              ),
            ),
          ),
          SizedBox(
            height: 42,
            child: ListView(
              scrollDirection: Axis.horizontal,
              padding: const EdgeInsets.symmetric(horizontal: 20),
              children: [
                ...['Всі', 'Заповнено', 'Без тарифу'].map(
                  (f) => Padding(
                    padding: const EdgeInsets.only(right: 8),
                    child: ChoiceChip(
                      label: Text(f),
                      selected: filter == f,
                      onSelected: (_) => setState(() => filter = f),
                    ),
                  ),
                ),
                FilterChip(
                  avatar: const Icon(Icons.groups_2_outlined, size: 18),
                  label: const Text('По експедитору'),
                  selected: groupByExpeditor,
                  onSelected: (v) => setState(() => groupByExpeditor = v),
                ),
              ],
            ),
          ),
          const SizedBox(height: 8),
          Expanded(
            child: FutureBuilder<List<RouteModel>>(
              future: future,
              builder: (context, snapshot) {
                if (snapshot.connectionState == ConnectionState.waiting) {
                  return const Center(child: CircularProgressIndicator());
                }
                if (snapshot.hasError) {
                  return Center(child: Text('Помилка: ${snapshot.error}'));
                }
                final allRoutes = snapshot.data ?? const <RouteModel>[];
                final warehouses = allRoutes
                    .map((r) => r.warehouse.trim())
                    .where((v) => v.isNotEmpty)
                    .toSet()
                    .toList()
                  ..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
                final regions = allRoutes
                    .map((r) => shippingRegion(r.warehouse))
                    .where((v) => v.isNotEmpty && v != 'Регіон не визначено')
                    .toSet()
                    .toList()
                  ..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
                final routes = _filtered(allRoutes);

                return Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.fromLTRB(20, 0, 20, 10),
                      child: Row(
                        children: [
                          Expanded(
                            child: DropdownButtonFormField<String>(
                              value: warehouses.contains(warehouseFilter)
                                  ? warehouseFilter
                                  : null,
                              isExpanded: true,
                              decoration: const InputDecoration(
                                labelText: 'Склад',
                                prefixIcon: Icon(Icons.warehouse_outlined),
                              ),
                              hint: const Text('Всі склади'),
                              items: warehouses
                                  .map((v) => DropdownMenuItem(
                                        value: v,
                                        child: Text(v,
                                            overflow: TextOverflow.ellipsis),
                                      ))
                                  .toList(),
                              onChanged: (v) =>
                                  setState(() => warehouseFilter = v),
                            ),
                          ),
                          const SizedBox(width: 10),
                          Expanded(
                            child: DropdownButtonFormField<String>(
                              value: regions.contains(regionFilter)
                                  ? regionFilter
                                  : null,
                              isExpanded: true,
                              decoration: const InputDecoration(
                                labelText: 'Регіон',
                                prefixIcon: Icon(Icons.location_city_outlined),
                              ),
                              hint: const Text('Всі регіони'),
                              items: regions
                                  .map((v) => DropdownMenuItem(
                                        value: v,
                                        child: Text(v,
                                            overflow: TextOverflow.ellipsis),
                                      ))
                                  .toList(),
                              onChanged: (v) =>
                                  setState(() => regionFilter = v),
                            ),
                          ),
                        ],
                      ),
                    ),
                    if (warehouseFilter != null || regionFilter != null)
                      Align(
                        alignment: Alignment.centerRight,
                        child: Padding(
                          padding: const EdgeInsets.fromLTRB(20, 0, 20, 6),
                          child: TextButton.icon(
                            onPressed: () => setState(() {
                              warehouseFilter = null;
                              regionFilter = null;
                            }),
                            icon: const Icon(Icons.filter_alt_off_outlined,
                                size: 18),
                            label: const Text('Скинути фільтри'),
                          ),
                        ),
                      ),
                    Expanded(
                      child: routes.isEmpty
                          ? const Center(child: Text('Маршрути не знайдено'))
                          : _buildRouteList(routes),
                    ),
                  ],
                );
              },
            ),
          ),
        ],
      ),
    );
  }

  Widget _buildRouteList(List<RouteModel> routes) {
    if (!groupByExpeditor) {
      return ListView.separated(
        padding: const EdgeInsets.fromLTRB(20, 8, 20, 24),
        itemCount: routes.length,
        separatorBuilder: (_, __) => const SizedBox(height: 12),
        itemBuilder: (context, i) => _routeCard(routes[i]),
      );
    }
    final grouped = <String, List<RouteModel>>{};
    for (final route in routes) {
      final key = route.expeditor.trim().isEmpty
          ? 'Без експедитора'
          : route.expeditor.trim();
      grouped.putIfAbsent(key, () => <RouteModel>[]).add(route);
    }
    final names = grouped.keys.toList()
      ..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
    return ListView(
      padding: const EdgeInsets.fromLTRB(20, 8, 20, 24),
      children: [
        for (final name in names) ...[
          Padding(
            padding: const EdgeInsets.fromLTRB(4, 8, 4, 10),
            child: Row(
              children: [
                const Icon(Icons.person_outline,
                    size: 19, color: Color(0xFF1677FF)),
                const SizedBox(width: 7),
                Expanded(
                  child: Text(name,
                      style: const TextStyle(
                          fontWeight: FontWeight.w900, fontSize: 16)),
                ),
                Text('${grouped[name]!.length} марш.',
                    style: const TextStyle(
                        color: Color(0xFF6C778A),
                        fontWeight: FontWeight.w700)),
              ],
            ),
          ),
          ...grouped[name]!.map((r) => Padding(
                padding: const EdgeInsets.only(bottom: 12),
                child: _routeCard(r),
              )),
        ],
      ],
    );
  }

  Widget _routeCard(RouteModel r) {
    return RouteCard(
      route: r,
      onTap: () async {
        final saved = await Navigator.of(context).push<bool>(
          MaterialPageRoute(
            builder: (_) => RouteDetailsPage(
                route: r, repo: widget.repo, demo: widget.demo),
          ),
        );
        if (saved == true) reload();
      },
    );
  }
}

'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git commit -m "Add warehouse and region dropdown filters"
          git push
