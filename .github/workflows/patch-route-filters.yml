name: Patch route grouping and warehouse region

on:
  push:
    paths:
      - '.github/workflows/patch-route-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.dart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()

          start = s.index('class RoutesPage extends StatefulWidget')
          end = s.index('class RouteCard extends StatelessWidget')
          new_routes = r'''class RoutesPage extends StatefulWidget {
  const RoutesPage({required this.repo, required this.date, required this.demo, super.key});
  final RouteRepository repo;
  final DateTime date;
  final bool demo;

  @override
  State<RoutesPage> createState() => _RoutesPageState();
}

class _RoutesPageState extends State<RoutesPage> {
  late Future<List<RouteModel>> future;
  final search = TextEditingController();
  String filter = 'Всі';
  bool groupByExpeditor = false;

  @override
  void initState() {
    super.initState();
    future = widget.repo.loadRoutes(widget.date);
    search.addListener(() => setState(() {}));
  }

  @override
  void dispose() {
    search.dispose();
    super.dispose();
  }

  @override
  void didUpdateWidget(covariant RoutesPage oldWidget) {
    super.didUpdateWidget(oldWidget);
    if (!DateUtils.isSameDay(oldWidget.date, widget.date)) {
      future = widget.repo.loadRoutes(widget.date);
    }
  }

  void reload() => setState(() => future = widget.repo.loadRoutes(widget.date));

  List<RouteModel> _applyFilters(List<RouteModel> source) {
    var routes = List<RouteModel>.from(source);
    if (filter == 'Заповнено') routes = routes.where((r) => r.completed).toList();
    if (filter == 'Без тарифу') routes = routes.where((r) => r.tariff == null || r.tariffUnknown).toList();
    final q = search.text.trim().toLowerCase();
    if (q.isNotEmpty) {
      routes = routes.where((r) {
        return r.expeditor.toLowerCase().contains(q) ||
            r.routeDeliveryId.toLowerCase().contains(q) ||
            r.warehouse.toLowerCase().contains(q) ||
            shippingRegion(r.warehouse).toLowerCase().contains(q);
      }).toList();
    }
    return routes;
  }

  @override
  Widget build(BuildContext context) {
    return SafeArea(
      child: Column(
        children: [
          PageHeader(
            title: 'Маршрути',
            subtitle: DateFormat('dd.MM.yyyy').format(widget.date),
            trailing: IconButton(onPressed: reload, icon: const Icon(Icons.refresh)),
          ),
          Padding(
            padding: const EdgeInsets.fromLTRB(20, 0, 20, 10),
            child: TextField(
              controller: search,
              decoration: InputDecoration(
                hintText: 'Пошук: експедитор, ID, склад, регіон',
                prefixIcon: const Icon(Icons.search),
                suffixIcon: search.text.isEmpty
                    ? null
                    : IconButton(
                        onPressed: search.clear,
                        icon: const Icon(Icons.close),
                      ),
              ),
            ),
          ),
          SizedBox(
            height: 42,
            child: ListView(
              scrollDirection: Axis.horizontal,
              padding: const EdgeInsets.symmetric(horizontal: 20),
              children: [
                ...['Всі', 'Заповнено', 'Без тарифу'].map((f) => Padding(
                  padding: const EdgeInsets.only(right: 8),
                  child: ChoiceChip(
                    label: Text(f),
                    selected: filter == f,
                    onSelected: (_) => setState(() => filter = f),
                  ),
                )),
                FilterChip(
                  avatar: const Icon(Icons.groups_2_outlined, size: 18),
                  label: const Text('По експедитору'),
                  selected: groupByExpeditor,
                  onSelected: (v) => setState(() => groupByExpeditor = v),
                ),
              ],
            ),
          ),
          const SizedBox(height: 8),
          Expanded(
            child: FutureBuilder<List<RouteModel>>(
              future: future,
              builder: (context, snapshot) {
                if (snapshot.connectionState == ConnectionState.waiting) {
                  return const Center(child: CircularProgressIndicator());
                }
                if (snapshot.hasError) return Center(child: Text('Помилка: ${snapshot.error}'));
                final routes = _applyFilters(snapshot.data ?? const <RouteModel>[]);
                if (routes.isEmpty) {
                  return const Center(child: Text('Маршрути не знайдено'));
                }

                if (!groupByExpeditor) {
                  return ListView.separated(
                    padding: const EdgeInsets.fromLTRB(20, 8, 20, 24),
                    itemCount: routes.length,
                    separatorBuilder: (_, __) => const SizedBox(height: 12),
                    itemBuilder: (context, i) => _routeCard(context, routes[i]),
                  );
                }

                final grouped = <String, List<RouteModel>>{};
                for (final route in routes) {
                  final key = route.expeditor.trim().isEmpty ? 'Без експедитора' : route.expeditor.trim();
                  grouped.putIfAbsent(key, () => <RouteModel>[]).add(route);
                }
                final names = grouped.keys.toList()..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));

                return ListView(
                  padding: const EdgeInsets.fromLTRB(20, 8, 20, 24),
                  children: [
                    for (final name in names) ...[
                      Padding(
                        padding: const EdgeInsets.fromLTRB(4, 8, 4, 10),
                        child: Row(
                          children: [
                            const Icon(Icons.person_outline, size: 19, color: Color(0xFF1677FF)),
                            const SizedBox(width: 7),
                            Expanded(
                              child: Text(name, style: const TextStyle(fontWeight: FontWeight.w900, fontSize: 16)),
                            ),
                            Text('${grouped[name]!.length} марш.', style: const TextStyle(color: Color(0xFF6C778A), fontWeight: FontWeight.w700)),
                          ],
                        ),
                      ),
                      ...grouped[name]!.map((r) => Padding(
                        padding: const EdgeInsets.only(bottom: 12),
                        child: _routeCard(context, r),
                      )),
                    ],
                  ],
                );
              },
            ),
          ),
        ],
      ),
    );
  }

  Widget _routeCard(BuildContext context, RouteModel r) {
    return RouteCard(
      route: r,
      onTap: () async {
        final saved = await Navigator.of(context).push<bool>(
          MaterialPageRoute(
            builder: (_) => RouteDetailsPage(route: r, repo: widget.repo, demo: widget.demo),
          ),
        );
        if (saved == true) reload();
      },
    );
  }
}

String shippingRegion(String warehouse) {
  final w = warehouse.trim().toLowerCase();
  if (w.isEmpty) return 'Регіон не визначено';
  if (w.contains('льв')) return 'Львів';
  if (w.contains('одес')) return 'Одеса';
  if (w.contains('дніпр') || w.contains('днепр')) return 'Дніпро';
  if (w.contains('харків') || w.contains('харьков')) return 'Харків';
  if (w.contains('вінниц') || w.contains('винниц')) return 'Вінниця';
  if (w.contains('черкас')) return 'Черкаси';
  if (w.contains('черніг') || w.contains('черниг')) return 'Чернігів';
  if (w.contains('полтав')) return 'Полтава';
  if (w.contains('хмельниц')) return 'Хмельницький';
  if (w.contains('рівн') || w.contains('ровн')) return 'Рівне';
  if (w.contains('луцьк') || w.contains('волин')) return 'Луцьк';
  if (w.contains('ужгород') || w.contains('закарпат')) return 'Ужгород';
  if (w.contains('франків') || w.contains('франков')) return 'Івано-Франківськ';
  if (w.contains('чернів') || w.contains('чернов')) return 'Чернівці';
  if (w.contains('терноп')) return 'Тернопіль';
  if (w.contains('кременч')) return 'Кременчук';
  if (w.contains('розум') || w.contains('чайк') || w.contains('білогород') || w.contains('белогород') || w.contains('київ') || w.contains('киев')) return 'Київ';
  return warehouse;
}

'''
          s = s[:start] + new_routes + s[end:]

          old = "              Text('${route.expeditor} · ${route.carrier ?? 'Перевізник не вказаний'}'),\n              const SizedBox(height: 14),"
          new = """              Text('${route.expeditor} · ${route.carrier ?? 'Перевізник не вказаний'}'),
              const SizedBox(height: 9),
              Wrap(
                spacing: 8,
                runSpacing: 6,
                children: [
                  _RouteInfoBadge(icon: Icons.warehouse_outlined, text: route.warehouse.isEmpty ? 'Склад не вказаний' : route.warehouse),
                  _RouteInfoBadge(icon: Icons.location_city_outlined, text: shippingRegion(route.warehouse)),
                ],
              ),
              const SizedBox(height: 14),"""
          if old not in s:
            raise SystemExit('RouteCard target not found')
          s = s.replace(old, new, 1)

          marker = 'class RouteMetric extends StatelessWidget'
          badge = r'''class _RouteInfoBadge extends StatelessWidget {
  const _RouteInfoBadge({required this.icon, required this.text});
  final IconData icon;
  final String text;

  @override
  Widget build(BuildContext context) {
    return Container(
      padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 6),
      decoration: BoxDecoration(
        color: const Color(0xFFF2F6FC),
        borderRadius: BorderRadius.circular(10),
      ),
      child: Row(
        mainAxisSize: MainAxisSize.min,
        children: [
          Icon(icon, size: 15, color: const Color(0xFF1677FF)),
          const SizedBox(width: 5),
          Text(text, style: const TextStyle(fontSize: 12, fontWeight: FontWeight.w700)),
        ],
      ),
    );
  }
}

'''
          s = s.replace(marker, badge + marker, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
