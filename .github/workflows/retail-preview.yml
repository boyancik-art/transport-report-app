name: Retail Test Preview

on:
  push:
    branches: [transport-control-retail-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retail-test-preview
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transport-control-retail-v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure web platform exists
        run: flutter create . --platforms=web --project-name transport_report_app --org com.transportreport
      - name: Remove generated test
        run: rm -rf test
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build Retail test app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            flutter build web --release --base-href /transport-report-app/retail/ \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          else
            echo "ERROR: Supabase secrets are missing; live Retail preview must use real data."
            exit 1
          fi
      - name: Prepare pages branch
        run: |
          cp -R build/web /tmp/retail-web
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/pages origin/gh-pages
          else
            mkdir -p /tmp/pages
            cd /tmp/pages
            git init
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git checkout --orphan gh-pages
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Retail subdirectory
        run: |
          cd /tmp/pages
          rm -rf retail
          mkdir -p retail
          cp -R /tmp/retail-web/* retail/
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add retail .nojekyll
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "Publish Retail test preview"
          git push origin HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
